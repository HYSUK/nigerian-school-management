<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · School admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f2f5f4; --panel:#fff; --ink:#15242b; --muted:#5a6b72; --line:#d3dcde; --brand:#12506b; --bad:#b5382f; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink);
         font:16px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; }
  form { width:min(380px, 92vw); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:28px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p { margin:0 0 20px; color:var(--muted); }
  label { display:block; font-weight:700; margin:14px 0 4px; }
  input { width:100%; padding:10px 12px; font:inherit; border:1px solid var(--line); border-radius:4px; }
  input:focus-visible, button:focus-visible { outline:3px solid #7fb4cc; outline-offset:1px; }
  button { margin-top:22px; width:100%; padding:11px; font:inherit; font-weight:700; color:#fff; background:var(--brand);
           border:0; border-radius:4px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #err { min-height:1.4em; margin-top:14px; color:var(--bad); }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>School admin</h1>
  <p>Sign in to update screening results, assessments and fees.</p>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="go" type="submit">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/admin/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
      body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Enter your username and password.');
    location.href = data.redirect || '/admin';
  } catch (e) { err.textContent = e.message; go.disabled = false; }
});
</script>
</body>
</html>
