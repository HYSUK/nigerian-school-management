<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>My Fees - Student Portal</title>
    <link rel="icon" type="image/png" href="/static/images/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 antialiased">

    <header class="bg-slate-900 text-white px-4 sm:px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-emerald-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-graduation-cap"></i></div>
            <div>
                <h1 class="font-bold text-sm tracking-wide">My Fees</h1>
                <p id="who" class="text-[11px] text-slate-400"></p>
            </div>
        </div>
        <a href="/dashboard" class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl transition"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Dashboard</a>
    </header>

    <main class="max-w-3xl mx-auto p-4 sm:p-6 space-y-6">

        <div id="alert" class="hidden p-4 rounded-xl text-sm font-medium border bg-rose-50 border-rose-200 text-rose-700"></div>

        <div class="flex items-center gap-3">
            <label for="period" class="text-xs font-bold text-slate-600">Term</label>
            <select id="period" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm font-medium"></select>
        </div>

        <section class="grid grid-cols-3 gap-3 sm:gap-4">
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                <p class="text-[11px] font-bold text-slate-400 uppercase">Charged</p>
                <p id="tCharged" class="text-base sm:text-xl font-extrabold text-slate-900">-</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                <p class="text-[11px] font-bold text-slate-400 uppercase">Paid</p>
                <p id="tPaid" class="text-base sm:text-xl font-extrabold text-emerald-700">-</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                <p class="text-[11px] font-bold text-slate-400 uppercase">Balance</p>
                <p id="tBalance" class="text-base sm:text-xl font-extrabold text-slate-900">-</p>
            </div>
        </section>

        <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <h2 class="px-5 py-4 text-sm font-extrabold text-slate-900 border-b border-slate-100">Fees for this term</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 text-slate-500 text-xs">
                        <tr><th class="text-left px-5 py-2.5">Fee</th><th class="text-right px-3">Charged</th><th class="text-right px-3">Paid</th><th class="text-right px-3">Balance</th><th class="text-left px-5">Status</th></tr>
                    </thead>
                    <tbody id="items"></tbody>
                </table>
            </div>
        </section>

        <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <h2 class="px-5 py-4 text-sm font-extrabold text-slate-900 border-b border-slate-100">Payments received</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 text-slate-500 text-xs">
                        <tr><th class="text-left px-5 py-2.5">Date</th><th class="text-left px-3">Fee</th><th class="text-right px-3">Amount</th><th class="text-left px-3">Method</th><th class="text-left px-5">Receipt</th></tr>
                    </thead>
                    <tbody id="payments"></tbody>
                </table>
            </div>
        </section>

        <p class="text-xs text-slate-500 text-center">Payments are recorded by the school office. If something looks wrong, please contact the office with your receipt.</p>
    </main>

<script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = n => new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN' }).format(n || 0);
    const $ = id => document.getElementById(id);
    const emptyRow = (cols, msg) => `<tr><td colspan="${cols}" class="px-5 py-6 text-center text-slate-400">${msg}</td></tr>`;

    async function load(session, term) {
        const q = session ? `?session=${encodeURIComponent(session)}&term=${encodeURIComponent(term)}` : '';
        try {
            const res = await fetch('/api/v1/student/me/fees' + q);
            if (res.status === 401) { window.location.href = '/apply'; return; }
            const d = await res.json();
            if (!res.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'Could not load your fees.');

            if (d.locked) {
                $('who').textContent = `${d.name} · ${d.class}`;
                document.querySelector('main').innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-8 text-center shadow-sm space-y-2">
                    <i class="fa-solid fa-lock text-3xl text-slate-300"></i>
                    <h2 class="text-base font-extrabold text-slate-900">Fees are not available yet</h2>
                    <p class="text-sm text-slate-600">Fees are shown only after your admission is confirmed. Please check your dashboard for your screening decision.</p></div>`;
                return;
            }

            $('who').textContent = `${d.name} · ${d.class}`;
            $('period').innerHTML = d.periods.map(p => {
                const sel = p.session === d.session && p.term === d.term ? ' selected' : '';
                return `<option value="${esc(p.session)}|${esc(p.term)}"${sel}>${esc(p.session)}, ${esc(p.term)} term</option>`;
            }).join('') || '<option>No fees set yet</option>';

            const charged = d.items.reduce((a, i) => a + Number(i.charged), 0);
            const paid = d.items.reduce((a, i) => a + Number(i.paid), 0);
            const balance = d.items.reduce((a, i) => a + Number(i.balance), 0);
            $('tCharged').textContent = money(charged);
            $('tPaid').textContent = money(paid);
            $('tBalance').textContent = money(balance);
            $('tBalance').className = 'text-base sm:text-xl font-extrabold ' + (balance > 0 ? 'text-rose-600' : 'text-emerald-700');

            $('items').innerHTML = d.items.length ? d.items.map(i => {
                const ok = Number(i.balance) <= 0;
                return `<tr class="border-t border-slate-100"><td class="px-5 py-3 font-medium">${esc(i.fee_name)}</td>
                    <td class="text-right px-3">${money(i.charged)}</td><td class="text-right px-3">${money(i.paid)}</td>
                    <td class="text-right px-3 font-bold ${ok ? '' : 'text-rose-600'}">${money(i.balance)}</td>
                    <td class="px-5"><span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${ok ? 'text-emerald-700 border-emerald-200 bg-emerald-50' : 'text-amber-700 border-amber-200 bg-amber-50'}">${ok ? 'Paid' : 'Owing'}</span></td></tr>`;
            }).join('') : emptyRow(5, 'No fees have been set for your class yet.');

            $('payments').innerHTML = d.payments.length ? d.payments.map(p => `<tr class="border-t border-slate-100">
                <td class="px-5 py-3">${esc(p.paid_on)}</td><td class="px-3">${esc(p.fee_name)}</td>
                <td class="text-right px-3 font-semibold">${money(p.amount_paid)}</td><td class="px-3">${esc(p.method)}</td>
                <td class="px-5"><a class="text-emerald-700 font-semibold underline" target="_blank" href="/api/v1/student/me/payments/${p.payment_id}/receipt"><i class="fa-solid fa-print mr-1"></i>Print</a></td></tr>`).join('')
                : emptyRow(5, 'No payments recorded for this term yet.');
            $('alert').classList.add('hidden');
        } catch (err) {
            $('alert').textContent = err.message;
            $('alert').classList.remove('hidden');
        }
    }

    $('period').addEventListener('change', e => {
        const [s, t] = e.target.value.split('|');
        if (t) load(s, t);
    });
    load('', '');
</script>
</body>
</html>
